<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus — Base de Datos Escolar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Overlay móvil -->
      <div id="sidebarOverlay" class="nx-overlay"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="nx-sidebar">
        <div class="nx-sidebar-header">
          <a href="/" class="nx-brand-sidebar">
            <img src="/src/assets/Nexus_logo.png" alt="Nexus" class="nx-brand-logo" />
            <span class="nx-brand-text">Nexus</span>
          </a>
          <button id="closeSidebar" class="nx-sidebar-close" aria-label="Cerrar sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <!-- Navegación de tablas -->
        <nav class="nx-sidebar-nav">
          <div class="nx-sidebar-label">Tablas</div>
          <button class="nx-sidebar-link active" data-table="alumnos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Alumnos
          </button>
          <button class="nx-sidebar-link" data-table="personal">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Personal
          </button>
          <button class="nx-sidebar-link" data-table="cursos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>
            Cursos
          </button>
          <button class="nx-sidebar-link" data-table="materias">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Materias
          </button>
        </nav>

        <!-- Filtros dinámicos -->
        <div class="nx-sidebar-filters" id="sidebarFilters">
          <!-- Se inyecta dinámicamente desde JS -->
        </div>
      </aside>

      <!-- Contenido principal -->
      <main class="nx-main">
        <!-- Topbar móvil -->
        <header class="nx-topbar">
          <button id="openSidebar" class="nx-topbar-menu" aria-label="Abrir sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
          </button>
          <img src="/src/assets/Nexus_wordmark.png" alt="Nexus" class="nx-topbar-brand" />
        </header>

        <!-- Hero / Buscador -->
        <section class="nx-hero">
          <div class="nx-hero-content">
            <h1 class="nx-hero-title">Base de Datos Escolar Maestra</h1>
            <p class="nx-hero-subtitle">Buscá y filtrá alumnos, personal, cursos y materias en tiempo real.</p>

            <!-- Search Box -->
            <div class="nx-searchbox">
              <svg class="nx-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input
                type="text"
                id="searchInput"
                class="nx-search-input"
                placeholder="Buscar por nombre, apellido, DNI, email..."
                autocomplete="off"
              />
              <kbd class="nx-kbd">ESC</kbd>
            </div>
          </div>

          <!-- Gradient orbs decoration -->
          <div class="nx-orb nx-orb-1"></div>
          <div class="nx-orb nx-orb-2"></div>
        </section>

        <!-- Stats -->
        <section class="nx-stats" id="statsSection">
          <div class="nx-stats-grid" id="statsGrid">
            <div class="nx-stat-skeleton"></div>
            <div class="nx-stat-skeleton"></div>
            <div class="nx-stat-skeleton"></div>
            <div class="nx-stat-skeleton"></div>
          </div>
        </section>

        <!-- Resultados -->
        <section class="nx-results">
          <div class="nx-results-header">
            <h2 class="nx-results-title" id="resultsTitle">Alumnos</h2>
            <span class="nx-results-count" id="resultsCount"></span>
          </div>
          <div class="nx-results-grid" id="resultsGrid">
            <div class="nx-empty">
              <div class="nx-empty-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </div>
              <p class="nx-empty-text">Seleccioná una tabla y escribí en el buscador para encontrar resultados</p>
            </div>
          </div>
        </section>

        <!-- Footer -->
        <footer class="nx-footer">
          <p class="nx-footer-text">
            Nexus — Base de Datos Escolar Maestra · Conectado a 
            <a href="https://supabase.com" target="_blank" class="nx-footer-link">Supabase</a>
          </p>
        </footer>
      </main>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
