<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus — Base de Datos Escolar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- ========== LOGIN ========== -->
      <section id="loginScreen" class="nx-login">
        <div class="nx-login-card">
          <div class="nx-login-brand">
            <img src="/src/assets/Nexus_logo.png" alt="Nexus" class="nx-login-logo">
            <img src="/src/assets/Nexus_wordmark.png" alt="Nexus" class="nx-login-wordmark">
          </div>
          <p class="nx-login-subtitle">Base de Datos Escolar Maestra</p>

          <form id="loginForm" class="nx-login-form">
            <div class="nx-login-field">
              <label class="nx-login-label">Email</label>
              <input type="email" id="loginEmail" class="nx-login-input" placeholder="tu@email.com" required>
            </div>
            <div class="nx-login-field">
              <label class="nx-login-label">Contraseña</label>
              <input type="password" id="loginPassword" class="nx-login-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="loginBtn" class="nx-login-btn">
              <span id="loginBtnText">Ingresar</span>
            </button>
          </form>

          <div class="nx-login-divider">
            <span>¿No tenés cuenta?</span>
          </div>

          <form id="registerForm" class="nx-login-form">
            <div class="nx-login-field">
              <input type="email" id="regEmail" class="nx-login-input" placeholder="Email" required>
            </div>
            <div class="nx-login-field">
              <input type="password" id="regPassword" class="nx-login-input" placeholder="Contraseña (min. 6 chars)" required minlength="6">
            </div>
            <div class="nx-login-field">
              <input type="text" id="regNombre" class="nx-login-input" placeholder="Nombre" required>
            </div>
            <div class="nx-login-field">
              <input type="text" id="regApellido" class="nx-login-input" placeholder="Apellido" required>
            </div>
            <button type="submit" id="regBtn" class="nx-login-btn nx-login-btn-outline">
              <span id="regBtnText">Crear cuenta</span>
            </button>
          </form>

          <p id="loginError" class="nx-login-error"></p>
        </div>
      </section>

      <!-- ========== APP ========== -->
      <div id="appContainer" class="nx-app hidden">
        <!-- Overlay móvil -->
        <div id="sidebarOverlay" class="nx-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="nx-sidebar">
          <div class="nx-sidebar-header">
            <a href="/" class="nx-brand-sidebar">
              <img src="/src/assets/Nexus_logo.png" alt="Nexus" class="nx-brand-logo">
              <span class="nx-brand-text">Nexus</span>
            </a>
            <button id="closeSidebar" class="nx-sidebar-close" aria-label="Cerrar sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <!-- Usuario logueado -->
          <div class="nx-sidebar-user" id="sidebarUser">
            <div class="nx-sidebar-user-avatar" id="userAvatar"></div>
            <div class="nx-sidebar-user-info">
              <div class="nx-sidebar-user-name" id="userName"></div>
              <div class="nx-sidebar-user-role" id="userRole"></div>
            </div>
          </div>

          <!-- Navegación de tablas -->
          <nav class="nx-sidebar-nav">
            <div class="nx-sidebar-label">Tablas</div>
            <button class="nx-sidebar-link active" data-table="alumnos">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Alumnos
            </button>
            <button class="nx-sidebar-link" data-table="personal">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Personal
            </button>
            <button class="nx-sidebar-link" data-table="cursos">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>
              Cursos
            </button>
            <button class="nx-sidebar-link" data-table="materias">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              Materias
            </button>
          </nav>

          <!-- Filtros dinámicos -->
          <div class="nx-sidebar-filters" id="sidebarFilters"></div>

          <!-- Logout -->
          <div class="nx-sidebar-footer">
            <button id="logoutBtn" class="nx-sidebar-logout">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar sesión
            </button>
          </div>
        </aside>

        <!-- Contenido principal -->
        <main class="nx-main">
          <!-- Topbar móvil -->
          <header class="nx-topbar">
            <button id="openSidebar" class="nx-topbar-menu" aria-label="Abrir sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
            </button>
            <img src="/src/assets/Nexus_wordmark.png" alt="Nexus" class="nx-topbar-brand">
          </header>

          <!-- Hero / Buscador -->
          <section class="nx-hero">
            <div class="nx-hero-content">
              <h1 class="nx-hero-title">Base de Datos Escolar Maestra</h1>
              <p class="nx-hero-subtitle">Buscá y filtrá alumnos, personal, cursos y materias en tiempo real.</p>

              <div class="nx-searchbox">
                <svg class="nx-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="searchInput" class="nx-search-input" placeholder="Buscar por nombre, apellido, DNI, email..." autocomplete="off">
                <kbd class="nx-kbd">ESC</kbd>
              </div>
            </div>

            <div class="nx-orb nx-orb-1"></div>
            <div class="nx-orb nx-orb-2"></div>
          </section>

          <!-- Stats -->
          <section class="nx-stats" id="statsSection">
            <div class="nx-stats-grid" id="statsGrid">
              <div class="nx-stat-skeleton"></div>
              <div class="nx-stat-skeleton"></div>
              <div class="nx-stat-skeleton"></div>
              <div class="nx-stat-skeleton"></div>
            </div>
          </section>

          <!-- Resultados -->
          <section class="nx-results">
            <div class="nx-results-header">
              <h2 class="nx-results-title" id="resultsTitle">Alumnos</h2>
              <span class="nx-results-count" id="resultsCount"></span>
            </div>
            <div class="nx-results-grid" id="resultsGrid"></div>
          </section>

          <!-- Footer -->
          <footer class="nx-footer">
            <p class="nx-footer-text">Nexus — Base de Datos Escolar Maestra</p>
          </footer>
        </main>
      </div>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
